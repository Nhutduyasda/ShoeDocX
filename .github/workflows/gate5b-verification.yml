name: Gate 5B verification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.ref == 'codex/universal-doc-engine-gate-5b-generic-multisheet'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine regression tests
        shell: bash
        run: dotnet test tests/ShoeExportInvoice.Tests/ShoeExportInvoice.Tests.csproj --filter FullyQualifiedName~UniversalDocEngine --logger 'trx;LogFileName=engine.trx' --results-directory evidence
      - name: Frontend build
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate5b-${{ matrix.os }}
          path: evidence/
          retention-days: 14
