# Synthetic, loopback-only staging. Generated private configuration is mandatory.
services:
  sql:
    hostname: sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: '2048'
      MSSQL_SA_PASSWORD: ${GATE6B_SQL_PASSWORD:?synthetic password required}
    volumes:
      - ${GATE6B_PRIVATE:?}/mssql.conf:/var/opt/mssql/mssql.conf:ro
      - ${GATE6B_PRIVATE}/sql.crt:/run/tls/sql.crt:ro
      - ${GATE6B_PRIVATE}/sql.key:/run/tls/sql.key:ro
      - sql-data:/var/opt/mssql/data
      - ${GATE6B_PRIVATE}/backup:/var/opt/mssql/backup
    networks:
      isolated:
        ipv4_address: 172.30.86.2
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
  backend:
    image: gate6b-api-trusted
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SHOEDOCX_CONFIGURATION_FILE: /run/secrets/runtime.json
    volumes:
      - ${GATE6B_PRIVATE}/runtime.json:/run/secrets/runtime.json:ro
      - ${GATE6B_PRIVATE}/protection.pfx:/run/secrets/protection.pfx:ro
      - ${GATE6B_PRIVATE}/data:/app/data
      - ${GATE6B_PRIVATE}/templates:/app/Templates:ro
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=0700,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    networks:
      isolated:
        ipv4_address: 172.30.86.3
  web:
    image: gate6b-web
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ${GATE6B_PRIVATE}/web.crt:/run/tls/web.crt:ro
      - ${GATE6B_PRIVATE}/web.key:/run/tls/web.key:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      isolated:
        ipv4_address: 172.30.86.4
      ingress:
        gw_priority: 1
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
networks:
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
  isolated:
    internal: true
    ipam:
      config: [{subnet: 172.30.86.0/24}]
volumes:
  sql-data:
