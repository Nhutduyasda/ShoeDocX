version: '3.8'

services:
  # 1. Backend Service: ASP.NET Core 8 Web API
  backend:
    build:
      context: .
      dockerfile: backend/ShoeExportInvoice.Api/Dockerfile
    container_name: shoe-export-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - FileStorage__Provider=Local
      - FileStorage__AllowLocalInProduction=true
      - ASPNETCORE_URLS=http://+:5270
      - ConnectionStrings__DefaultConnection=${SQLSERVER_CONNECTION_STRING:?SQLSERVER_CONNECTION_STRING must be configured}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - Xnk__CustomsStoragePath=/app/data/customs
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - Jwt__Key=${JWT_KEY:?JWT_KEY must be configured}
      - BootstrapAdmin__Enabled=${BOOTSTRAP_ADMIN_ENABLED:-false}
      - BootstrapAdmin__Username=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BootstrapAdmin__FullName=${BOOTSTRAP_ADMIN_FULL_NAME:-System Administrator}
    volumes:
      # Lưu trữ file nghiệp vụ/đính kèm; database nằm trên SQL Server
      - ./data:/app/data
      # Mount thư mục Templates từ máy host để có thể cập nhật mẫu Excel trực tiếp
      - ./Templates:/app/Templates
    ports:
      - "${BACKEND_PORT:-5270}:5270"
    networks:
      - app-network

  # 2. Frontend Service: React + Vite SPA served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shoe-export-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

